version: 2

models:
  - name: fct_events
    description: Fact table with one row per website event.
    columns:
      - name: event_id
        description: Primary key for the website event. Mart grain is one row per website event.
        data_tests:
          - not_null
          - unique
      - name: visitor_id
        description: Visitor associated with the event.
        data_tests:
          - not_null
      - name: session_id
        description: Session associated with the event.
        data_tests:
          - not_null
      - name: event_type
        description: Type of website event captured by the generator.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - page_view
                  - click
                  - product_view
                  - search
                  - add_to_cart
                  - begin_checkout
                  - purchase
                  - form_submit
                  - newsletter_signup
      - name: event_timestamp
        description: Timezone-aware timestamp for the event.
        data_tests:
          - not_null
      - name: properties
        description: Event-specific properties preserved as raw JSONB.
      - name: product_id
        description: Product identifier extracted from event properties when present.
      - name: category
        description: Product or content category extracted from event properties when present.
      - name: price
        description: Product price extracted from event properties when present.
      - name: quantity
        description: Item quantity extracted from event properties when present.
      - name: cart_value
        description: Cart value extracted from event properties when present.
      - name: search_query
        description: Search query extracted from event properties when present.
      - name: results_count
        description: Search result count extracted from event properties when present.
      - name: items_count
        description: Item count extracted from event properties when present.
      - name: order_id
        description: Order identifier extracted from event properties when present.
      - name: order_value
        description: Order value extracted from event properties when present.
      - name: form_id
        description: Submitted form identifier extracted from event properties when present.
      - name: newsletter_id
        description: Newsletter identifier extracted from event properties when present.

  - name: fct_sessions
    description: Fact table with one row per source-provided visitor session.
    columns:
      - name: session_id
        description: Primary key for the website session. Mart grain is one row per visitor session.
        data_tests:
          - not_null
          - unique
      - name: visitor_id
        description: Visitor associated with the session.
        data_tests:
          - not_null
      - name: event_count
        description: Count of events in the session.
        data_tests:
          - not_null
      - name: page_view_count
        description: Count of page view events in the session.
        data_tests:
          - not_null
      - name: purchase_count
        description: Count of purchase events in the session.
        data_tests:
          - not_null
      - name: order_count
        description: Count of distinct purchase order identifiers in the session.
        data_tests:
          - not_null
      - name: total_order_value
        description: Total purchase order value in the session.
        data_tests:
          - not_null

  - name: dim_visitors
    description: Dimension table with one row per generated website visitor.
    columns:
      - name: visitor_id
        description: Primary key for the generated visitor. Mart grain is one row per visitor.
        data_tests:
          - not_null
          - unique
      - name: session_count
        description: Count of sessions for the visitor.
        data_tests:
          - not_null
      - name: event_count
        description: Count of events for the visitor.
        data_tests:
          - not_null
      - name: purchase_count
        description: Count of purchase events for the visitor.
        data_tests:
          - not_null
      - name: order_count
        description: Count of distinct purchase order identifiers for the visitor.
        data_tests:
          - not_null
      - name: total_order_value
        description: Total purchase order value for the visitor.
        data_tests:
          - not_null
