version: 2

models:
  - name: stg_raw__events
    description: Staged raw website events, kept at the source event grain with typed JSON property extraction. Campaign fields extracted from raw events properties are synthetic acquisition provenance.
    columns:
      - name: event_id
        description: Primary key for the website event.
        data_tests:
          - not_null
          - unique
      - name: visitor_id
        description: Identifier for the generated visitor associated with the event.
        data_tests:
          - not_null
      - name: session_id
        description: Identifier for the generated visitor session associated with the event.
        data_tests:
          - not_null
      - name: page
        description: Source page value associated with the event.
      - name: page_name
        description: Website page visited by the event.
        data_tests:
          - not_null
      - name: timestamp
        description: Source timezone-aware timestamp for the event.
      - name: event_timestamp
        description: Timezone-aware timestamp for the event.
        data_tests:
          - not_null
      - name: event_type
        description: Type of website event captured by the generator.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - page_view
                  - click
                  - product_view
                  - search
                  - add_to_cart
                  - begin_checkout
                  - purchase
                  - form_submit
                  - newsletter_signup
      - name: properties
        description: Event-specific properties preserved as raw JSONB, including synthetic acquisition provenance when campaign-driven events are generated.
      - name: utm_source
        description: Synthetic campaign UTM source extracted from event properties when present.
      - name: utm_medium
        description: Synthetic campaign UTM medium extracted from event properties when present.
      - name: utm_campaign
        description: Synthetic campaign UTM campaign extracted from event properties when present.
      - name: campaign_id
        description: Synthetic campaign identifier extracted from event properties when present.
      - name: channel
        description: Synthetic acquisition channel extracted from event properties when present.
      - name: is_campaign_driven
        description: True when event properties include campaign_id or utm_campaign.
      - name: product_id
        description: Product identifier extracted from event properties when present.
      - name: category
        description: Product or content category extracted from event properties when present.
      - name: price
        description: Product price extracted from event properties when present.
      - name: quantity
        description: Item quantity extracted from event properties when present.
      - name: cart_value
        description: Cart value extracted from event properties when present.
      - name: search_query
        description: Search query extracted from event properties when present.
      - name: results_count
        description: Search result count extracted from event properties when present.
      - name: items_count
        description: Item count extracted from event properties when present.
      - name: order_id
        description: Order identifier extracted from event properties when present.
      - name: order_value
        description: Order value extracted from event properties when present.
      - name: form_id
        description: Submitted form identifier extracted from event properties when present.
      - name: newsletter_id
        description: Newsletter identifier extracted from event properties when present.
      - name: first_name
        description: Visitor first name extracted from event properties when present on lifecycle identity events.
      - name: last_name
        description: Visitor last name extracted from event properties when present on lifecycle identity events.
      - name: email
        description: Visitor email extracted from event properties when present on signup, newsletter signup, or purchase lifecycle events.
      - name: phone
        description: Visitor phone number extracted from event properties when present on purchase lifecycle events.
      - name: shipping_state
        description: Shipping state extracted from event properties when present on purchase lifecycle events. This is descriptive geography and does not drive behavior, attribution, or demographic inference.
      - name: shipping_postal_code
        description: Shipping postal code extracted from event properties when present on purchase lifecycle events. This is descriptive geography and does not drive behavior, attribution, or demographic inference.

  - name: stg_raw__campaigns
    description: Staged raw generated campaign inputs, preserved at one row per date_day and campaign_id. actual_adstock and actual_saturated_demand are synthetic truth/debug fields for QA only and must not be exposed in marts because real-life warehouses would infer them.
    columns:
      - name: date_day
        description: Campaign calendar date.
        data_tests:
          - not_null
      - name: campaign_id
        description: Identifier for the generated campaign.
        data_tests:
          - not_null
      - name: channel
        description: Generated acquisition channel for the campaign.
      - name: utm_source
        description: Generated UTM source value for campaign-driven traffic.
      - name: utm_medium
        description: Generated UTM medium value for campaign-driven traffic.
      - name: utm_campaign
        description: Generated UTM campaign value for campaign-driven traffic.
      - name: daily_spend
        description: Generated non-negative daily campaign spend input.
        data_tests:
          - not_null
      - name: actual_adstock
        description: Synthetic-only non-negative diagnostic truth field for generated adstock. Real campaign warehouses would infer this value; use only in staging, QA, validation, or clearly named diagnostic models.
      - name: actual_saturated_demand
        description: Synthetic-only diagnostic truth field for generated saturated demand, expected to be between 0 and 1. Real campaign warehouses would infer this value; use only in staging, QA, validation, or clearly named diagnostic models.

  - name: stg_website
    description: Website page dimension staging model with one row per distinct page in the source-managed page-link graph. page_path and page_name are sourced from the graph node identifier; CMS page metadata is null until a page-inventory source is available. Website traffic flow is calculated separately from raw.events using session-ordered events.
    columns:
      - name: page_id
        description: Primary key for the website page. Model grain is one row per website page.
        data_tests:
          - not_null
          - unique
      - name: page_path
        description: Canonical non-empty path for the website page.
        data_tests:
          - not_null
      - name: page_name
        description: Page identifier from the source-managed graph, used as the page name until CMS metadata is available.
      - name: page_type
        description: Website page classification, null because the current graph source does not provide page inventory metadata.
      - name: parent_page_id
        description: Identifier of the parent website page, null because the current graph source does not provide page hierarchy metadata.
      - name: is_active
        description: Whether the page is active in the source system.
      - name: published_at
        description: Timezone-aware timestamp when the page was first published.
      - name: updated_at
        description: Timezone-aware timestamp when the page was most recently updated.

  - name: stg_website_page_links
    description: Clean source-managed website page links with one row per distinct from_page and to_page pair. transition_probability is intentionally excluded; website traffic flow is calculated separately from raw.events using session-ordered events.
    columns:
      - name: from_page
        description: Origin page in the source-managed page link.
        data_tests:
          - not_null
      - name: to_page
        description: Destination page in the source-managed page link.
        data_tests:
          - not_null

unit_tests:
  - name: stg_raw__events_extracts_profile_properties
    model: stg_raw__events
    given:
      - input: source('raw', 'events')
        format: sql
        rows: |
          select
              'event_profile' as event_id,
              'visitor_profile' as visitor_id,
              'session_profile' as session_id,
              'newsletter' as page,
              '2026-01-01 10:00:00+00'::timestamptz as timestamp,
              'newsletter_signup' as event_type,
              '{
                  "first_name": "Ada",
                  "last_name": "Lovelace",
                  "email": "ada@example.com",
                  "phone": "",
                  "shipping_state": "",
                  "shipping_postal_code": ""
              }'::jsonb as properties
          union all
          select
              'event_anonymous' as event_id,
              'visitor_anonymous' as visitor_id,
              'session_anonymous' as session_id,
              'home' as page,
              '2026-01-01 10:01:00+00'::timestamptz as timestamp,
              'page_view' as event_type,
              '{"product_id": "sku-001"}'::jsonb as properties
    expect:
      format: sql
      rows: |
        select
            'event_profile' as event_id,
            'visitor_profile' as visitor_id,
            'session_profile' as session_id,
            'newsletter' as page,
            'newsletter' as page_name,
            '2026-01-01 10:00:00+00'::timestamptz as timestamp,
            '2026-01-01 10:00:00+00'::timestamptz as event_timestamp,
            'newsletter_signup' as event_type,
            '{
                "first_name": "Ada",
                "last_name": "Lovelace",
                "email": "ada@example.com",
                "phone": "",
                "shipping_state": "",
                "shipping_postal_code": ""
            }'::jsonb as properties,
            null as utm_source,
            null as utm_medium,
            null as utm_campaign,
            null as campaign_id,
            null as channel,
            false as is_campaign_driven,
            null as product_id,
            null as category,
            null::numeric as price,
            null::integer as quantity,
            null::numeric as cart_value,
            null as search_query,
            null::integer as results_count,
            null::integer as items_count,
            null as order_id,
            null::numeric as order_value,
            null as form_id,
            null as newsletter_id,
            'Ada' as first_name,
            'Lovelace' as last_name,
            'ada@example.com' as email,
            null as phone,
            null as shipping_state,
            null as shipping_postal_code
        union all
        select
            'event_anonymous' as event_id,
            'visitor_anonymous' as visitor_id,
            'session_anonymous' as session_id,
            'home' as page,
            'home' as page_name,
            '2026-01-01 10:01:00+00'::timestamptz as timestamp,
            '2026-01-01 10:01:00+00'::timestamptz as event_timestamp,
            'page_view' as event_type,
            '{"product_id": "sku-001"}'::jsonb as properties,
            null as utm_source,
            null as utm_medium,
            null as utm_campaign,
            null as campaign_id,
            null as channel,
            false as is_campaign_driven,
            'sku-001' as product_id,
            null as category,
            null::numeric as price,
            null::integer as quantity,
            null::numeric as cart_value,
            null as search_query,
            null::integer as results_count,
            null::integer as items_count,
            null as order_id,
            null::numeric as order_value,
            null as form_id,
            null as newsletter_id,
            null as first_name,
            null as last_name,
            null as email,
            null as phone,
            null as shipping_state,
            null as shipping_postal_code
