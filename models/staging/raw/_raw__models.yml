version: 2

models:
  - name: stg_raw__events
    description: Staged raw website events, kept at the source event grain with typed JSON property extraction.
    columns:
      - name: event_id
        description: Primary key for the website event.
        data_tests:
          - not_null
          - unique
      - name: visitor_id
        description: Identifier for the generated visitor associated with the event.
        data_tests:
          - not_null
      - name: session_id
        description: Identifier for the generated visitor session associated with the event.
        data_tests:
          - not_null
      - name: page
        description: Source page value associated with the event.
      - name: page_name
        description: Website page visited by the event.
        data_tests:
          - not_null
      - name: timestamp
        description: Source timezone-aware timestamp for the event.
      - name: event_timestamp
        description: Timezone-aware timestamp for the event.
        data_tests:
          - not_null
      - name: event_type
        description: Type of website event captured by the generator.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - page_view
                  - click
                  - product_view
                  - search
                  - add_to_cart
                  - begin_checkout
                  - purchase
                  - form_submit
                  - newsletter_signup
      - name: properties
        description: Event-specific properties preserved as raw JSONB.
      - name: product_id
        description: Product identifier extracted from event properties when present.
      - name: category
        description: Product or content category extracted from event properties when present.
      - name: price
        description: Product price extracted from event properties when present.
      - name: quantity
        description: Item quantity extracted from event properties when present.
      - name: cart_value
        description: Cart value extracted from event properties when present.
      - name: search_query
        description: Search query extracted from event properties when present.
      - name: results_count
        description: Search result count extracted from event properties when present.
      - name: items_count
        description: Item count extracted from event properties when present.
      - name: order_id
        description: Order identifier extracted from event properties when present.
      - name: order_value
        description: Order value extracted from event properties when present.
      - name: form_id
        description: Submitted form identifier extracted from event properties when present.
      - name: newsletter_id
        description: Newsletter identifier extracted from event properties when present.
      - name: first_name
        description: Visitor first name extracted from event properties when present on lifecycle identity events.
      - name: last_name
        description: Visitor last name extracted from event properties when present on lifecycle identity events.
      - name: email
        description: Visitor email extracted from event properties when present on signup, newsletter signup, or purchase lifecycle events.
      - name: phone
        description: Visitor phone number extracted from event properties when present on purchase lifecycle events.
      - name: shipping_state
        description: Shipping state extracted from event properties when present on purchase lifecycle events. This is descriptive geography and does not drive behavior, attribution, or demographic inference.
      - name: shipping_postal_code
        description: Shipping postal code extracted from event properties when present on purchase lifecycle events. This is descriptive geography and does not drive behavior, attribution, or demographic inference.

unit_tests:
  - name: stg_raw__events_extracts_profile_properties
    model: stg_raw__events
    given:
      - input: source('raw', 'events')
        format: sql
        rows: |
          select
              'event_profile' as event_id,
              'visitor_profile' as visitor_id,
              'session_profile' as session_id,
              'newsletter' as page,
              '2026-01-01 10:00:00+00'::timestamptz as timestamp,
              'newsletter_signup' as event_type,
              '{
                  "first_name": "Ada",
                  "last_name": "Lovelace",
                  "email": "ada@example.com",
                  "phone": "",
                  "shipping_state": "",
                  "shipping_postal_code": ""
              }'::jsonb as properties
          union all
          select
              'event_anonymous' as event_id,
              'visitor_anonymous' as visitor_id,
              'session_anonymous' as session_id,
              'home' as page,
              '2026-01-01 10:01:00+00'::timestamptz as timestamp,
              'page_view' as event_type,
              '{"product_id": "sku-001"}'::jsonb as properties
    expect:
      format: sql
      rows: |
        select
            'event_profile' as event_id,
            'visitor_profile' as visitor_id,
            'session_profile' as session_id,
            'newsletter' as page,
            'newsletter' as page_name,
            '2026-01-01 10:00:00+00'::timestamptz as timestamp,
            '2026-01-01 10:00:00+00'::timestamptz as event_timestamp,
            'newsletter_signup' as event_type,
            '{
                "first_name": "Ada",
                "last_name": "Lovelace",
                "email": "ada@example.com",
                "phone": "",
                "shipping_state": "",
                "shipping_postal_code": ""
            }'::jsonb as properties,
            null as product_id,
            null as category,
            null::numeric as price,
            null::integer as quantity,
            null::numeric as cart_value,
            null as search_query,
            null::integer as results_count,
            null::integer as items_count,
            null as order_id,
            null::numeric as order_value,
            null as form_id,
            null as newsletter_id,
            'Ada' as first_name,
            'Lovelace' as last_name,
            'ada@example.com' as email,
            null as phone,
            null as shipping_state,
            null as shipping_postal_code
        union all
        select
            'event_anonymous' as event_id,
            'visitor_anonymous' as visitor_id,
            'session_anonymous' as session_id,
            'home' as page,
            'home' as page_name,
            '2026-01-01 10:01:00+00'::timestamptz as timestamp,
            '2026-01-01 10:01:00+00'::timestamptz as event_timestamp,
            'page_view' as event_type,
            '{"product_id": "sku-001"}'::jsonb as properties,
            'sku-001' as product_id,
            null as category,
            null::numeric as price,
            null::integer as quantity,
            null::numeric as cart_value,
            null as search_query,
            null::integer as results_count,
            null::integer as items_count,
            null as order_id,
            null::numeric as order_value,
            null as form_id,
            null as newsletter_id,
            null as first_name,
            null as last_name,
            null as email,
            null as phone,
            null as shipping_state,
            null as shipping_postal_code
