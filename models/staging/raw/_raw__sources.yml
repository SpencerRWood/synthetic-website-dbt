version: 2

sources:
  - name: raw
    database: synthetic_website_data
    schema: raw
    description: Raw website event, campaign, and page-inventory data loaded by upstream systems.
    tables:
      - name: events
        description: Raw website events. Grain is one row per generated website event. Campaign fields in properties are synthetic acquisition provenance used to attribute generated campaign-driven traffic.
        columns:
          - name: event_id
            description: Primary key for the raw website event.
            data_tests:
              - not_null
              - unique
          - name: visitor_id
            description: Identifier for the generated visitor associated with the event.
            data_tests:
              - not_null
          - name: session_id
            description: Identifier for the generated visitor session associated with the event.
            data_tests:
              - not_null
          - name: page
            description: Website page visited by the event.
            data_tests:
              - not_null
          - name: timestamp
            description: Timezone-aware timestamp for the event.
            data_tests:
              - not_null
          - name: event_type
            description: Type of website event captured by the generator.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - page_view
                      - click
                      - product_view
                      - search
                      - add_to_cart
                      - begin_checkout
                      - purchase
                      - form_submit
                      - newsletter_signup
          - name: properties
            description: Event-specific properties captured as raw JSONB, including synthetic acquisition provenance such as utm_source, utm_medium, utm_campaign, campaign_id, and channel when campaign-driven events are generated.
      - name: campaigns
        description: Raw generated campaign inputs at one row per date_day and campaign_id, including known campaign configuration such as spend, channel, and UTM values. The actual_* fields are generator-known synthetic truth/debug values and are not production-realistic analytics fields.
        columns:
          - name: date_day
            description: Campaign calendar date for the generated daily campaign input.
            data_tests:
              - not_null
          - name: campaign_id
            description: Identifier for the generated campaign.
            data_tests:
              - not_null
          - name: channel
            description: Generated acquisition channel for the campaign.
          - name: utm_source
            description: Generated UTM source value for campaign-driven traffic.
          - name: utm_medium
            description: Generated UTM medium value for campaign-driven traffic.
          - name: utm_campaign
            description: Generated UTM campaign value for campaign-driven traffic.
          - name: daily_spend
            description: Generated daily spend input for the campaign.
          - name: actual_adstock
            description: Synthetic-only diagnostic truth field for generated adstock. Real campaign warehouses would infer this and marts must not expose it.
          - name: actual_saturated_demand
            description: Synthetic-only diagnostic truth field for generated saturated demand, constrained from 0 to 1. Real campaign warehouses would infer this and marts must not expose it.
      - name: website
        description: Raw website page inventory and page-link data from a CMS, sitemap, or site-management system. Website traffic flow is calculated separately from raw.events using session-ordered events; transition_probability is retained only in raw and is not propagated into models.
        columns:
          - name: page_id
            description: Identifier for the website page.
          - name: page_path
            description: Canonical path for the website page.
          - name: page_name
            description: Human-readable website page name.
          - name: page_type
            description: Website page classification supplied by the source system.
          - name: parent_page_id
            description: Identifier of the website page's parent, when present.
          - name: is_active
            description: Whether the page is active in the source system.
          - name: published_at
            description: Timestamp when the page was first published.
          - name: updated_at
            description: Timestamp when the page was most recently updated.
          - name: from_page
            description: Source-managed origin page in a known page-to-page link.
          - name: to_page
            description: Source-managed destination page in a known page-to-page link.
          - name: transition_probability
            description: Raw-only transition probability. It is not propagated to staging or marts because navigation behavior is not modeled from this source.
